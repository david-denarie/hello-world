# Nom de l'application
spring.application.name=text-reverser

# ─── Serveur HTTPS ───────────────────────────────────────────────────────────
# Port HTTPS (remplace le HTTP 8080)
server.port=8443

# Keystore auto-signé pour le développement local
# Générer avec : keytool -genkeypair -alias textreverser -keyalg RSA -keysize 2048 \
#   -storetype PKCS12 -keystore src/main/resources/keystore.p12 -validity 365 \
#   -storepass changeit -dname "CN=localhost"
server.ssl.key-store=classpath:keystore.p12
server.ssl.key-store-password=changeit
server.ssl.key-store-type=PKCS12
server.ssl.key-alias=textreverser

# ─── Logging des requêtes (dev uniquement) ───────────────────────────────────
spring.mvc.log-request-details=true
logging.level.org.springframework.web.filter.CommonsRequestLoggingFilter=DEBUG

# ─── Limites de requête ──────────────────────────────────────────────────────
# Taille max du body HTTP (protection contre les payloads trop volumineux)
server.tomcat.max-http-form-post-size=64KB
spring.servlet.multipart.max-request-size=64KB
spring.servlet.multipart.max-file-size=64KB

# ─── Logging ─────────────────────────────────────────────────────────────────
# Niveau général
logging.level.root=INFO

# Voir les requêtes entrantes et la sécurité en détail
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.security=DEBUG

# Logs de ton application
logging.level.com.example.textreverser=DEBUG

# Écriture dans un fichier (en plus de la console)
logging.file.name=logs/text-reverser.log
logging.file.max-size=10MB
logging.file.max-history=7
