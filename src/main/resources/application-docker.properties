# ─── Profil Docker ────────────────────────────────────────────────────────────
# HTTP simple sur le port 8080 (le TLS est terminé par le reverse proxy / load balancer)
server.port=8080

# Désactiver SSL (pas de keystore dans le conteneur)
server.ssl.enabled=false

# CORS : même origine (frontend servi par Spring Boot), pas de requêtes cross-origin.
# En production derrière un reverse proxy, adapter au domaine réel :
# app.cors.allowed-origins=https://mon-domaine.com
app.cors.allowed-origins=http://localhost:8080

# Logging
logging.level.root=INFO
logging.level.com.example.textreverser=INFO
